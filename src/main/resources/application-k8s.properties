# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/consensus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public

# ── Mail (MailHog) ────────────────────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:mailhog}
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Object storage (MinIO) ────────────────────────────────────────────────────
minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=consensus-exports

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Swagger ───────────────────────────────────────────────────────────────────
springdoc.swagger-ui.servers[0].url=https://api.getconsensus.xyz
springdoc.swagger-ui.servers[0].description=Production
