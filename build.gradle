plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Consensus'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    set('springModulithVersion', "2.1.1")
}

dependencies {
    // ── Core web ──────────────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'


    // ── Persistence ───────────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // ── Excel export ─────────────────────────────────────────────────────
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.minio:minio:8.5.7'

    // ── Utilities ─────────────────────────────────────────────────────────
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ── Dev tools ─────────────────────────────────────────────────────────
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // ── Test ──────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── Future starters (uncomment as each level is built) ────────────────────
// Level 3+  : implementation 'org.springframework.boot:spring-boot-starter-security'
// Level 5+  : implementation 'org.springframework.boot:spring-boot-starter-data-redis'
// Level 6   : implementation 'org.springframework.boot:spring-boot-starter-kafka'
//             implementation 'org.apache.kafka:kafka-streams'

// Level 6   : implementation 'org.springframework.boot:spring-boot-starter-batch'
//             implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
// Observ.   : implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
//             runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
// Later     : implementation 'org.springframework.boot:spring-boot-starter-graphql'
// Later     : implementation 'org.springframework.boot:spring-boot-starter-grpc-client'
//             implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
// Later     : implementation 'org.springframework.boot:spring-boot-starter-cassandra'
// Later     : implementation 'org.springframework.boot:spring-boot-starter-elasticsearch'
// Later     : implementation 'org.springframework.cloud:spring-cloud-starter-zookeeper-config'

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}
