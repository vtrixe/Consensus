apiVersion: apps/v1
kind: Deployment
metadata:
  name: consensus
  namespace: consensus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consensus
  template:
    metadata:
      labels:
        app: consensus
    spec:
      containers:
        - name: consensus
          image: vtrixe/consensus:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: consensus-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: consensus-secrets
                  key: jwt-secret
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: consensus-secrets
                  key: db-password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: consensus
  namespace: consensus
spec:
  type: NodePort
  selector:
    app: consensus
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
